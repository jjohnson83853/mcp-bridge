# Example mcp-bridge configuration
#
# Secrets & Environment Variables Reference:
# - Environment variable secrets: {env: VARIABLE_NAME}
#   * client_auth.bearer_tokens: Inbound client bearer tokens.
#   * embedding.api_key: Upstream embedding model provider API key.
#   * servers[].credentials.bearer: Upstream MCP server bearer token.
#   * servers[].credentials.headers.<Header>: Custom HTTP header secret.
# - Secret files: {file: "path/to/file"}
#   * Paths are relative to this config file.
#   * Must be regular, non-symlink, operator-owned files with 0400 or 0600 permissions.
# - Runtime environment variables (honored directly by mcp-bridge):
#   * MCP_STATELESS: "true" for stateless mode, "false" for session-aware streamable HTTP.
#   * MCP_SESSION_ADMISSION_ENABLED: "true" to admit valid Mcp-Session-Id requests without repeating Bearer token.
#   * MCP_RESOURCE_URL: Canonical MCP endpoint advertised in RFC 9728 metadata (e.g. "https://mcp.bullprog.com/mcp").
#   * POCKET_ID_ISSUER: Pocket ID issuer URL (e.g. "https://id.bullprog.com").
#   * POCKET_ID_JWKS_URL: JWKS endpoint for validating Bearer JWTs (e.g. "https://id.bullprog.com/.well-known/jwks.json").
#   * MCP_REQUIRED_SCOPE: Optional required OAuth scope (e.g. "mcp:connect").

schema_version: 1
http:
  listen: "127.0.0.1:8080"
  allowed_hosts: ["127.0.0.1:8080", "localhost:8080"]
  allowed_origins: []
  max_request_bytes: 1048576
  requests_per_second: 50
  burst: 100
  max_sessions: 128
  session_idle_timeout: "10m"
operations:
  listen: "127.0.0.1:9090"
  requests_per_second: 10
  burst: 20
storage:
  directory: "./data"
  max_snapshot_bytes: 268435456
catalog:
  refresh_interval: "5m"
  stale_after: "15m"
  max_tools_per_server: 10000
  max_tools_total: 20000
  max_pages_per_server: 1000
  max_schema_bytes: 262144
  max_description_bytes: 32768
search:
  default_top_k: 10
  max_top_k: 50
  timeout: "5s"
  query_cache_entries: 256
  query_cache_ttl: "5m"
  keyword_weight: 0.5
  embedding_weight: 0.5
  rrf_constant: 60
embedding:
  provider: "openai-compatible"
  model: "OPERATOR_SELECTED_MODEL"
  model_revision: "OPERATOR_SELECTED_REVISION"
  base_url: "https://embeddings.invalid/v1"
  dimensions: 1536
  api_key: {env: BRIDGE_EMBEDDING_KEY}
  timeout: "3s"
  max_concurrency: 2
  batch_size: 32
  max_response_bytes: 4194304
client_auth:
  bearer_tokens:
    - {env: BRIDGE_CLIENT_TOKEN}
upstream_defaults:
  connect_timeout: "5s"
  call_timeout: "30s"
  refresh_timeout: "15s"
  max_concurrent_calls: 8
  max_event_bytes: 4194304
  max_response_bytes: 8388608
  breaker:
    consecutive_failures: 3
    open_duration: "30s"
    half_open_probes: 1
servers:
  - id: developer-api
    endpoint: "https://developer-upstream.invalid/mcp"
    credentials:
      bearer: {env: DEVELOPER_UPSTREAM_TOKEN}
      headers:
        # Relative {file:} paths resolve against this document's directory.
        X-API-Key: {file: "secrets/developer-api-key"}
  - id: portainer-api
    endpoint: "https://portainer-upstream.invalid/mcp"
    # Native prompt pass-through is enabled per server by default; set this to
    # true to exclude one server from prompt discovery and exposure.
    prompts_disabled: false
    credentials:
      bearer: {env: PORTAINER_UPSTREAM_TOKEN}
    limits:
      max_concurrent_calls: 4
      call_timeout: "20s"
pins: []
